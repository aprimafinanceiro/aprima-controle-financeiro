# Configuração do Nginx para Aprima Imoveis
# Copie este arquivo para: /etc/nginx/sites-available/aprima-imoveis

# Rate limiting (proteção contra abuso)
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/s;

# Upstream (servidor backend)
upstream aprima_app {
    server 127.0.0.1:5000 fail_timeout=10s max_fails=3;
}

# Redirecionar HTTP para HTTPS (descomente após configurar SSL)
# server {
#     listen 80;
#     server_name seu-dominio.com;
#     return 301 https://$server_name$request_uri;
# }

# Configuração principal
server {
    listen 80;
    server_name seu-dominio.com;  # ALTERE AQUI para seu domínio ou IP

    # Ou se não tiver domínio, use apenas:
    # listen 80 default_server;

    # Logs
    access_log /var/log/nginx/aprima-access.log;
    error_log /var/log/nginx/aprima-error.log;

    # Tamanho máximo de upload (para imagens)
    client_max_body_size 10M;

    # Timeout
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rota principal
    location / {
        proxy_pass http://aprima_app;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (se necessário no futuro)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Webhook com rate limiting
    location /webhook {
        limit_req zone=webhook_limit burst=20 nodelay;

        proxy_pass http://aprima_app;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (sem rate limiting)
    location /health {
        proxy_pass http://aprima_app;
        access_log off;
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Configuração HTTPS (será criada automaticamente pelo Certbot)
# Não precisa adicionar manualmente, o certbot --nginx faz isso
